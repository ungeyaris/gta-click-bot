name: ClipDad

# Boten går i løkke i ca. 5,5 timer per kjøring og sjekker hvert 3. minutt.
# Når den er ferdig, starter den neste kjøring selv. Timeplanen under er bare en reserve.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: clipdad
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null

      - name: Installer Python-pakker
        run: pip install -q -r requirements.txt

      - name: Hent lagret tilstand
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Hent Whisper-modell
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Kjør boten
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_KAI: ${{ secrets.CHAT_KAI }}
          CHAT_SPEED: ${{ secrets.CHAT_SPEED }}
          CHAT_GTA: ${{ secrets.CHAT_GTA }}
          LOOP_MINUTES: "320"
          CYCLE_SECONDS: "180"
        run: python bot.py

      - name: Lagre tilstand
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start neste kjøring
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main --repo ${{ github.repository }}
